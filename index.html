e}@media(max-width:700px){.fields{grid-template-columns:1fr 1fr}.wrap{padding:10px}.panel{padding:12px}th,td{padding:5px}table{font-size:12px}}@media print{@page{size:A4 portrait;margin:12mm}body{background:white;color:black}.top,.noprint,.buttons,.hint,.archive,.settings{display:none!important}.wrap{padding:0;max-width:none}.panel{border:0;padding:0;margin:0}.printhead{display:block;text-align:center;margin-bottom:16px}.printhead h1{margin:0;font-size:21px}.printhead p{margin:5px}.fields{display:none}h2{display:none}table{font-size:10pt}th,td{border:1px solid #333;padding:5px}thead{display:table-header-group}.scroll{overflow:visible}table{width:100%;table-layout:auto}#rows td input{width:100%;min-width:0}#rows td.out,#rows td.rolcol,#rows td.idx{min-width:0}tr{break-inside:avoid}td button{display:none}td input{border:0;padding:0;text-align:center;font-size:10pt;appearance:none}.noprint{display:none!important}td:last-child{display:none!important}th:last-child{display:none!important}.summary{text-align:left}} /* Narrow dimension entry columns on screen; keep other columns unchanged */ @media screen {   #rows td:nth-child(2), #rows td:nth-child(3),   table:has(#rows) thead th:nth-child(2), table:has(#rows) thead th:nth-child(3) {width:78px;min-width:78px;max-width:78px;padding-left:3px;padding-right:3px}   #rows td:nth-child(2) input, #rows td:nth-child(3) input {width:68px;min-width:0;max-width:68px;padding:6px 3px;text-align:center} } &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header class=&quot;top&quot;&gt;&lt;b&gt;ROLET SET&lt;/b&gt;&lt;div&gt;Urdhra pune për prodhim&lt;/div&gt;&lt;/header&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;div class=&quot;printhead&quot;&gt;&lt;h1&gt;ROLET SET&lt;/h1&gt;&lt;p&gt;&lt;strong&gt;DIMENSIONET PËR PRERJE — &lt;span id=&quot;printProduct&quot;&gt;RRJETË ROLO&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p id=&quot;printMeta&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;section class=&quot;panel noprint&quot;&gt;&lt;h2&gt;Urdhër pune&lt;/h2&gt;&lt;div style=&quot;margin-bottom:12px&quot;&gt;&lt;label&gt;Produkti&lt;/label&gt;&lt;select id=&quot;product&quot; onchange=&quot;changeProduct()&quot;&gt;&lt;option value=&quot;mreza&quot;&gt;RRJETË ROLO&lt;/option&gt;&lt;option value=&quot;roletni&quot;&gt;ROLETA&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;&lt;div&gt;&lt;label&gt;Numri i urdhrit&lt;/label&gt;&lt;input id=&quot;orderNo&quot; placeholder=&quot;001&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Klienti&lt;/label&gt;&lt;input id=&quot;customer&quot; placeholder=&quot;Emri i klientit&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;Data&lt;/label&gt;&lt;input id=&quot;date&quot; type=&quot;date&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;buttons&quot;&gt;&lt;button onclick=&quot;newOrder()&quot; class=&quot;light&quot;&gt;+ Urdhër i ri&lt;/button&gt;&lt;button onclick=&quot;saveOrder()&quot;&gt;Ruaj urdhrin&lt;/button&gt;&lt;button onclick=&quot;printOrder()&quot;&gt;Printo A4 / PDF&lt;/button&gt;&lt;button class=&quot;light&quot; onclick=&quot;printOrder()&quot;&gt;Ruaj në PDF&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;Dimensionet për prerje — &lt;span id=&quot;productTitle&quot;&gt;RRJETË ROLO&lt;/span&gt;&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Nr.&lt;/th&gt;&lt;th&gt;GJERËSIA&lt;/th&gt;&lt;th&gt;LARTËSIA&lt;/th&gt;&lt;th id=&quot;headD&quot;&gt;KUTIJA&lt;/th&gt;&lt;th class=&quot;rolcol hidden&quot;&gt;M/V&lt;/th&gt;&lt;th class=&quot;rolcol hidden&quot;&gt;14/16.5&lt;/th&gt;&lt;th id=&quot;headE&quot;&gt;SHINA&lt;/th&gt;&lt;th class=&quot;rolcol hidden&quot;&gt;FLETA&lt;/th&gt;&lt;th id=&quot;headF&quot;&gt;TEGI&lt;/th&gt;&lt;th class=&quot;rolcol hidden&quot;&gt;OSOVINA&lt;/th&gt;&lt;th class=&quot;noprint&quot;&gt;Fshij&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;buttons noprint&quot;&gt;&lt;button class=&quot;light&quot; onclick=&quot;addRow()&quot;&gt;+ Shto dimension&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;summary&quot; id=&quot;total&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel noprint&quot;&gt;&lt;h2&gt;Statusi&lt;/h2&gt;&lt;select id=&quot;status&quot;&gt;&lt;option value=&quot;I ri&quot;&gt;I ri&lt;/option&gt;&lt;option value=&quot;Në prodhim&quot;&gt;Në prodhim&lt;/option&gt;&lt;option value=&quot;I përfunduar&quot;&gt;I përfunduar&lt;/option&gt;&lt;option value=&quot;I dorëzuar&quot;&gt;I dorëzuar&lt;/option&gt;&lt;/select&gt;&lt;/section&gt;&lt;section class=&quot;panel settings noprint&quot;&gt;&lt;h2&gt;Rregullimi i formulave (cm) — RRJETË ROLO&lt;/h2&gt;&lt;p class=&quot;hint&quot;&gt;Vlerat zbriten nga gjerësia ose lartësia. Urdhrat e vjetër ruajnë formulat e tyre.&lt;/p&gt;&lt;div class=&quot;fields&quot;&gt;&lt;div&gt;&lt;label&gt;KUTIJA: gjerësia −&lt;/label&gt;&lt;input id=&quot;k&quot; type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;SHINA: lartësia −&lt;/label&gt;&lt;input id=&quot;s&quot; type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;5&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;label&gt;TEGI: gjerësia −&lt;/label&gt;&lt;input id=&quot;t&quot; type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;7&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;buttons&quot;&gt;&lt;button class=&quot;light&quot; onclick=&quot;setDefaults()&quot;&gt;Kthe 3 / 5 / 7&lt;/button&gt;&lt;button onclick=&quot;saveSettings()&quot;&gt;Ruaj formulat për urdhrat e rinj&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel archive noprint&quot;&gt;&lt;h2&gt;Arkiva e urdhrave&lt;/h2&gt;&lt;input id=&quot;search&quot; placeholder=&quot;Kërko klientin, numrin, datën ose statusin&quot; oninput=&quot;renderArchive()&quot;&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Urdhri&lt;/th&gt;&lt;th&gt;Klienti&lt;/th&gt;&lt;th&gt;Data&lt;/th&gt;&lt;th&gt;Produkti&lt;/th&gt;&lt;th&gt;Statusi&lt;/th&gt;&lt;th&gt;Veprimi&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;archiveRows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;Të dhënat ruhen në këtë shfletues dhe pajisje. Për sinkronizim ndërmjet telefonit dhe kompjuterit duhet bazë online. Bëj kopje rezervë.&lt;/p&gt;&lt;div class=&quot;buttons&quot;&gt;&lt;button class=&quot;light&quot; onclick=&quot;exportBackup()&quot;&gt;Shkarko kopje rezervë&lt;/button&gt;&lt;button class=&quot;light&quot; onclick=&quot;document.getElementById('backup').click()&quot;&gt;Rikthe kopjen rezervë&lt;/button&gt;&lt;input id=&quot;backup&quot; type=&quot;file&quot; accept=&quot;application/json&quot; class=&quot;hidden&quot; onchange=&quot;importBackup(event)&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt; let product=&quot;mreza&quot;;const KEY='roletset_mreza_v1',SET='roletset_mreza_settings';let currentId=null;let data=read(KEY,{orders:[]});let settings=read(SET,{k:3,s:5,t:7});function read(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch{return def}}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function number(v){return Number(String(v).replace(',','.'))}function fmt(v){return Number.isFinite(v)?Number(v.toFixed(2)).toLocaleString('de-DE',{maximumFractionDigits:2}):'—'}function esc(v){return String(v??'').replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]))}function offsets(){return {k:number(document.getElementById('k').value),s:number(document.getElementById('s').value),t:number(document.getElementById('t').value)}}function applyOffsets(o){for(let key of ['k','s','t'])document.getElementById(key).value=o[key]}function addRow(row={w:'',h:''}){let tr=document.createElement('tr');tr.innerHTML=`&lt;td class=&quot;idx&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; step=&quot;0.1&quot; min=&quot;0&quot; class=&quot;w&quot; value=&quot;${esc(row.w)}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; step=&quot;0.1&quot; min=&quot;0&quot; class=&quot;h&quot; value=&quot;${esc(row.h)}&quot;&gt;&lt;/td&gt;&lt;td class=&quot;out k&quot;&gt;&lt;/td&gt;&lt;td class=&quot;rolcol hidden mv&quot;&gt;&lt;/td&gt;&lt;td class=&quot;rolcol hidden kasa&quot;&gt;&lt;/td&gt;&lt;td class=&quot;out s&quot;&gt;&lt;/td&gt;&lt;td class=&quot;rolcol hidden fleta&quot;&gt;&lt;/td&gt;&lt;td class=&quot;out t&quot;&gt;&lt;/td&gt;&lt;td class=&quot;rolcol hidden osovina&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;danger tiny&quot; onclick=&quot;this.closest('tr').remove();recalc()&quot;&gt;×&lt;/button&gt;&lt;/td&gt;`;document.getElementById('rows').append(tr);tr.querySelectorAll('.rolcol').forEach(x=&gt;x.classList.toggle('hidden',product!=='roletni'));tr.querySelectorAll('input').forEach(x=&gt;x.addEventListener('input',recalc));recalc()}function rows(){return [...document.querySelectorAll('#rows tr')].map(tr=&gt;({w:tr.querySelector('.w').value,h:tr.querySelector('.h').value}))}function recalc(){let count=0,errors=0,o=offsets();[...document.querySelectorAll('#rows tr')].forEach((tr,i)=&gt;{tr.querySelector('.idx').textContent=i+1;let wi=tr.querySelector('.w').value,hi=tr.querySelector('.h').value,w=number(wi),h=number(hi),filled=wi!==''&amp;&amp;hi!=='';let rolet=product==='roletni';let ok=filled&amp;&amp;Number.isFinite(w)&amp;&amp;Number.isFinite(h)&amp;&amp;(rolet?w&gt;7.5&amp;&amp;h&gt;(h&gt;160?16.5:14):w&gt;Math.max(o.k,o.t)&amp;&amp;h&gt;o.s&amp;&amp;Object.values(o).every(Number.isFinite));let kasa=h&gt;160?16.5:14;tr.querySelector('.k').textContent=ok?fmt(rolet?w-1:w-o.k):'—';tr.querySelector('.s').textContent=ok?fmt(rolet?w-7.5:h-o.s):'—';tr.querySelector('.t').textContent=ok?fmt(rolet?h-kasa:w-o.t):'—';tr.querySelector('.mv').textContent=ok?(h&gt;160?'M':'V'):'—';tr.querySelector('.kasa').textContent=ok?fmt(kasa):'—';tr.querySelector('.fleta').textContent=ok?String(Math.round((h-8)/3.9)):'—';tr.querySelector('.osovina').textContent=ok?fmt(w-6):'—';if(ok)count++;else if(wi!==''||hi!=='')errors++});document.getElementById('total').textContent=`Gjithsej: ${count} pozicione${errors?' · Kontrollo pozicionet e pavlefshme: '+errors:''}`;return errors===0}function validate(){let r=rows();if(!r.length||r.some(x=&gt;x.w===''||x.h==='')){alert('Plotëso të gjitha dimensionet ose fshi rreshtat bosh.');return false}if(!recalc()){alert('Kontrollo dimensionet dhe formulat.');return false}return true}function newOrder(){currentId=null;document.getElementById('orderNo').value=String(data.orders.reduce((m,o)=&gt;Math.max(m,parseInt(o.no)||0),0)+1).padStart(3,'0');document.getElementById('customer').value='';document.getElementById('date').value=new Date().toLocaleDateString('en-CA');document.getElementById('status').value='I ri';applyOffsets(settings);document.getElementById('rows').innerHTML='';addRow()}function payload(){return{id:currentId||('n'+Date.now()),product:product,no:document.getElementById('orderNo').value.trim(),customer:document.getElementById('customer').value.trim(),date:document.getElementById('date').value,status:document.getElementById('status').value,offsets:offsets(),rows:rows()}}function saveOrder(){if(!validate())return;let p=payload();if(!p.no){alert('Shkruaj numrin e urdhrit.');return}if(data.orders.some(o=&gt;o.no===p.no&amp;&amp;o.id!==p.id)){alert('Ky numër urdhri ekziston.');return}let i=data.orders.findIndex(o=&gt;o.id===p.id);if(i&lt;0)data.orders.push(p);else data.orders[i]=p;currentId=p.id;try{persist();renderArchive();alert('Urdhri u ruajt në këtë pajisje.')}catch(e){alert('Ruajtja dështoi: '+e.message)}}function printOrder(){if(!validate())return;document.getElementById('printProduct').textContent=product==='roletni'?'ROLETA':'RRJETË ROLO';document.getElementById('printMeta').textContent=`Urdhri: ${document.getElementById('orderNo').va  (komunikim i sigurt mes iframe). window.addEventListener('message',function(event){  if(event.source!==document.getElementById('price').contentWindow||!event.data||event.data.kind!=='roletset-production-transfer')return;  const o=event.data.offer;  if(!o||!Array.isArray(o.rows))return;  const groups={roletni:[],mreza:[],plise:[]};  for(const r of o.rows){   const type=(r.product==='Roletë alumini'||r.product==='Roletë me kuti fasade')?'roletni':r.product==='Rrjetë rolo'?'mreza':r.product==='Rrjetë plise'?'plise':null;   if(!type)continue;   const q=Number(r.qty);   if(!Number.isInteger(q)||q<1||q>1000)continue;   for(let i=0;i<q;i++)groups[type].push({w:r.w,h:r.h});  }  const tasks=Object.entries(groups).filter(([k,v])=>v.length);  if(!tasks.length){alert('Nuk ka dimensione për prodhim.');return;}  for(const [type,rows] of tasks){   const target=document.getElementById(type==='plise'?'plise':'prod');   const order={id:'from-offer:'+o.id+':'+type,no:o.no+'-'+(type==='roletni'?'R':type==='mreza'?'M':'P'),customer:o.client,date:o.date,product:type,rows};   target.contentWindow.postMessage({kind:'roletset-production-import',order},'*');  }  const first=tasks[0][0];  document.getElementById('production-choice').value=first;  document.getElementById('production-menu').hidden=false;  document.getElementById('prod').hidden=first==='plise';  document.getElementById('plise').hidden=first!=='plise';  document.getElementById('price').hidden=true;document.getElementById('pay').hidden=true;  for(const x of ['prod','price','pay'])document.getElementById('tab-'+x).classList.toggle('active',x==='prod'); }); window.addEventListener('message',function(event){  if(!event.data||event.data.kind!=='roletset-production-import-result')return;  if(event.source!==document.getElementById('prod').contentWindow&&event.source!==document.getElementById('plise').contentWindow)return;  if(!event.data.ok)alert('Gabim në prodhim: '+event.data.error); }); </script></body></html>
