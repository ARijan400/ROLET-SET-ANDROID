&lt;script&gt;
const KEY='roletset_ofertat_v1';let db=read();let active=null;let nextRowId=0;const $=id=&gt;document.getElementById(id);const products=[['Roletë alumini',42],['Roletë me kuti fasade',45],['Venecianer Z90',45],['Rrjetë plise',25],['Rrjetë rolo',25],['Variolajt',25],['Produkt tjetër',0]];
function read(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&amp;&amp;Array.isArray(x.offers)?x:{offers:[]}}catch{return {offers:[]}}}
function esc(x){return String(x??'').replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]))}
function num(x){let s=String(x??'').trim().replace(',','.');return s===''?NaN:Number(s)}
function euro(x){return x.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function addRow(item={}){let tr=document.createElement('tr');tr.dataset.rid=++nextRowId;let selected=item.product||products[0][0];tr.innerHTML=`&lt;td class=&quot;idx&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;select class=&quot;item&quot;&gt;${products.map(p=&gt;`&lt;option value=&quot;${esc(p[0])}&quot; ${selected===p[0]?'selected':''}&gt;${esc(p[0])}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;w&quot; type=&quot;number&quot; step=&quot;0.1&quot; min=&quot;0&quot; value=&quot;${esc(item.w??'')}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;h&quot; type=&quot;number&quot; step=&quot;0.1&quot; min=&quot;0&quot; value=&quot;${esc(item.h??'')}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;qty&quot; type=&quot;number&quot; step=&quot;1&quot; min=&quot;1&quot; value=&quot;${esc(item.qty??1)}&quot;&gt;&lt;/td&gt;&lt;td class=&quot;area&quot;&gt;—&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;price&quot; type=&quot;number&quot; step=&quot;0.01&quot; min=&quot;0&quot; value=&quot;${esc(item.price??products.find(p=&gt;p[0]===selected)?.[1]??0)}&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input class=&quot;motor&quot; type=&quot;number&quot; step=&quot;0.01&quot; min=&quot;0&quot; value=&quot;${esc(item.motor??0)}&quot;&gt;&lt;/td&gt;&lt;td class=&quot;subtotal&quot;&gt;—&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;danger&quot; onclick=&quot;this.closest('tr').remove();calc()&quot;&gt;×&lt;/button&gt;&lt;/td&gt;`;$('rows').append(tr);tr.querySelectorAll('input').forEach(el=&gt;el.addEventListener('input',calc));tr.querySelector('.item').addEventListener('change',()=&gt;{tr.querySelector('.price').value=products.find(p=&gt;p[0]===tr.querySelector('.item').value)?.[1]??0;calc()});calc()}
function getRows(){return [...$('rows').querySelectorAll('tr')].map(tr=&gt;({product:tr.querySelector('.item').value,w:tr.querySelector('.w').value,h:tr.querySelector('.h').value,qty:tr.querySelector('.qty').value,price:tr.querySelector('.price').value,motor:tr.querySelector('.motor').value}))}
function compute(r){let w=num(r.w),h=num(r.h),q=num(r.qty),p=num(r.price),m=num(r.motor);if(![w,h,q,p,m].every(Number.isFinite)||w&lt;=0||h&lt;=0||!Number.isInteger(q)||q&lt;1||p&lt;0||m&lt;0)return null;let area=Math.max(1,(w*Math.max(h,100))/10000);return {area,amount:Math.round((area*p+m)*q*100)/100}}
function calc(){let sum=0,invalid=0;[...$('rows').querySelectorAll('tr')].forEach((tr,i)=&gt;{tr.querySelector('.idx').textContent=i+1;let r={product:tr.querySelector('.item').value,w:tr.querySelector('.w').value,h:tr.querySelector('.h').value,qty:tr.querySelector('.qty').value,price:tr.querySelector('.price').value,motor:tr.querySelector('.motor').value};let c=compute(r);tr.querySelector('.area').textContent=c?euro(c.area*Number(r.qty)):'—';tr.querySelector('.subtotal').textContent=c?euro(c.amount):'—';if(c)sum+=c.amount;else invalid++});$('total').textContent='Gjithsej: '+euro(sum)+' €';$('error').textContent=invalid?'Plotëso ose korrigjo '+invalid+' pozicione.':'';return invalid===0&amp;&amp;getRows().length&gt;0}
function validate(){if(!calc()){alert('Kontrollo të gjitha dimensionet, sasitë dhe çmimet.');return false}return true}
function newOffer(){active=null;$('no').value=String(db.offers.reduce((a,o)=&gt;Math.max(a,parseInt(o.no)||0),0)+1).padStart(3,'0');$('client').value='';$('date').value=new Date().toLocaleDateString('en-CA');$('note').value='';$('rows').innerHTML='';addRow()}
function payload(){return {id:active||'o'+Date.now(),no:$('no').value.trim(),client:$('client').value.trim(),date:$('date').value,note:$('note').value.trim(),rows:getRows(),total:getRows().reduce((s,r)=&gt;s+(compute(r)?.amount||0),0)}}
function saveOffer(){if(!validate())return;let o=payload();if(!o.no){alert('Shkruaj numrin e ofertës.');return}if(db.offers.some(x=&gt;x.no===o.no&amp;&amp;x.id!==o.id)){alert('Ky numër oferte ekziston.');return}let i=db.offers.findIndex(x=&gt;x.id===o.id);if(i&lt;0)db.offers.push(o);else db.offers[i]=o;active=o.id;try{localStorage.setItem(KEY,JSON.stringify(db));renderArchive();alert('Oferta u ruajt. Për ta kaluar te pagesat, shtyp butonin Kalo te pagesat.')}catch(e){alert('Ruajtja dështoi: '+e.message)}}
function printOffer(){if(!validate())return;$('printMeta').textContent='Nr. '+$('no').value+'  |  Klienti: '+($('client').value||'—')+'  |  Data: '+$('date').value+($('note').value?'  |  '+$('note').value:'');window.print()}
function loadOffer(id){let o=db.offers.find(x=&gt;x.id===id);if(!o)return;active=o.id;for(let k of ['no','client','date','note'])$(k).value=o[k]||'';$('rows').innerHTML='';o.rows.forEach(addRow);window.scrollTo(0,0)}
function deleteOffer(id){if(!confirm('A dëshiron ta fshish ofertën?'))return;db.offers=db.offers.filter(x=&gt;x.id!==id);localStorage.setItem(KEY,JSON.stringify(db));renderArchive();if(active===id)newOffer()}
function renderArchive(){let q=$('search').value.toLowerCase();$('archiveRows').innerHTML=db.offers.filter(o=&gt;[o.no,o.client,o.date].join(' ').toLowerCase().includes(q)).sort((a,b)=&gt;(b.date||'').localeCompare(a.date||'')).map(o=&gt;`&lt;tr&gt;&lt;td&gt;${esc(o.no)}&lt;/td&gt;&lt;td&gt;${esc(o.client)}&lt;/td&gt;&lt;td&gt;${esc(o.date)}&lt;/td&gt;&lt;td&gt;${euro(Number(o.total)||0)}&lt;/td&gt;&lt;td&gt;&lt;button onclick=&quot;loadOffer('${o.id}')&quot;&gt;Hap&lt;/button&gt; &lt;button onclick=&quot;sendArchivedToPayments('${o.id}')&quot;&gt;➜ Pagesa&lt;/button&gt; &lt;button class=&quot;danger&quot; onclick=&quot;deleteOffer('${o.id}')&quot;&gt;Fshij&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`).join('')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ROLET_SET_OFERTA_BACKUP.json';a.click();setTimeout(()=&gt;URL.revokeObjectURL(url),1000)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=&gt;{try{let d=JSON.parse(r.result);if(!Array.isArray(d.offers))throw Error('Formati nuk është i saktë');if(!confirm('Të zëvendësohen ofertat aktuale me kopjen rezervë?'))return;db=d;localStorage.setItem(KEY,JSON.stringify(db));renderArchive();newOffer();alert('Kopja u rikthye.')}catch(err){alert('Gabim: '+err.message)}};r.readAsText(f);e.target.value=''}
newOffer();renderArchive();

function sendArchivedToPayments(id){let o=db.offers.find(x=&gt;x.id===id);if(o)transferOffer(o)}
function sendCurrentToPayments(){if(!validate())return;let o=payload();if(!o.no||!o.client.trim()){alert('Shkruaj numrin dhe klientin.');return}if(db.offers.some(x=&gt;x.no===o.no&amp;&amp;x.id!==o.id)){alert('Ky numër oferte ekziston.');return}let i=db.offers.findIndex(x=&gt;x.id===o.id);if(i&lt;0)db.offers.push(o);else db.offers[i]=o;active=o.id;localStorage.setItem(KEY,JSON.stringify(db));renderArchive();transferOffer(o)}
function transferOffer(o){if(!o.client.trim()){alert('Oferta duhet të ketë emrin e klientit.');return}parent.postMessage({kind:'roletset-offer-transfer',offer:{id:o.id,no:o.no,client:o.client,total:o.total,rows:o.rows}},'*')}

function importPhotoDimensions(){
 const data=[[235,236,1],[138,245,2],[93,155,1],[153,160,1],[93,160,1],[153,155,1],[192,160,1],[28,251,1]];

)}}function addPayment(id){let o=items.find(x=&gt;x.id===id);if(!o)return;let v=prompt('Sa euro pagoi '+o.client+' tani?',String(Math.max(0,o.amount-o.paid).toFixed(2)));if(v===null)return;let n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n&lt;=0||o.paid+n&gt;o.amount+0.001){alert('Shuma nuk është e vlefshme.');return}o.paid=Math.min(o.amount,Math.round((o.paid+n)*100)/100);if(o.paid&gt;=o.amount){o.due='';o.installment=0}else{let date=prompt('Afati i këstit tjetër (VVVV-MM-DD):',o.due||'');if(date!==null&amp;&amp;(!date||/^\d{4}-\d{2}-\d{2}$/.test(date)))o.due=date;let installment=prompt('Shuma e këstit tjetër (€):',String(o.installment||''));if(installment!==null&amp;&amp;installment.trim()!=='')o.installment=Math.max(0,Number(installment.replace(',','.'))||0)}persist()}function status(o){let rem=Math.max(0,o.amount-o.paid);if(rem&lt;0.005)return ['Paguar','ok'];if(o.due&amp;&amp;dayDiff(o.due)&lt;0)return ['Vonesë '+Math.abs(dayDiff(o.due))+' ditë','late'];if(o.due&amp;&amp;dayDiff(o.due)&lt;=o.days)return ['Afati afër','late'];return [o.paid&gt;0?'Me këste':'Pa paguar','pill']}function render(){let total=0,paid=0,late=0,upcoming=[];for(let o of items){total+=o.amount;paid+=o.paid;let rem=o.amount-o.paid;if(rem&gt;.005&amp;&amp;o.due&amp;&amp;dayDiff(o.due)&lt;=o.days){upcoming.push(o);if(dayDiff(o.due)&lt;0)late++}}$('totals').textContent='Detyrime: '+money(total)+'  |  Paguar: '+money(paid)+'  |  Mbeten: '+money(total-paid);$('alerts').innerHTML=upcoming.length?'&lt;div class=&quot;warning&quot;&gt;&lt;b&gt;🔔 '+upcoming.length+' pagesa për t’u kontrolluar ('+late+' me vonesë)&lt;/b&gt;&lt;div&gt;'+upcoming.map(o=&gt;esc(o.client)+' — '+money(o.amount-o.paid)+' — '+(dayDiff(o.due)&lt;0?'Vonesë '+(-dayDiff(o.due))+' ditë':'Afati '+esc(o.due))).join('&lt;br&gt;')+'&lt;/div&gt;&lt;/div&gt;':'&lt;p class=&quot;ok&quot;&gt;Nuk ka afate të kaluara ose që afrohen.&lt;/p&gt;';let q=$('search').value.toLowerCase(),f=$('filter').value;let rows=items.filter(o=&gt;{l s=v;persist()}}catch(e){alert('Kopje rezervë e pavlefshme')}inp.value=''};r.readAsText(f)}function notifyPermission(){if(!('Notification' in window)){alert('Ky shfletues nuk i mbështet njoftimet për këtë skedar. Kujtesat brenda programit funksionojnë.');return}Notification.requestPermission().then(x=&gt;{alert(x==='granted'?'Leja u aktivizua. Njoftimet funksionojnë vetëm kur programi është i hapur.':'Leja për njoftime nuk u aktivizua.');if(x==='granted')notifyDue()}).catch(()=&gt;alert('Njoftimet e sistemit nuk janë të disponueshme.'))}function notifyDue(){if(!('Notification' in window)||Notification.permission!=='granted')return;let due=items.filter(o=&gt;o.amount-o.paid&gt;.005&amp;&amp;o.due&amp;&amp;dayDiff(o.due)&lt;=o.days);if(due.length)try{new Notification('ROLET SET – Kujtesë pagesash',{body:due.length+' klientë me pagesa afër afatit ose me vonesë.'})}catch(e){}}

  const win=frame.contentWindow;
  if(!win||!win.document||!win.document.getElementById('product'))return;
  const current=win.document.getElementById('product');
  if(current.value!==selected){current.value=selected;win.changeProduct();}
 }catch(e){console.warn('Produkti nuk u ndërrua:',e)}
}
